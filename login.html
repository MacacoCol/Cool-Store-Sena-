<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cool Studio: tienda en línea de camisetas con letras urbanas.">
  <title>Iniciar sesión | Cool Studio</title>
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/paginas.css">
</head>
<body>
  <main class="centrado">
    <div class="auth simple">
      <form class="formulario" action="#" method="post">
        <a class="logo" href="index.html">COOL <span>STUDIO</span></a>
        <h1>Iniciar sesión</h1>
        <div class="campo"><label for="usuario">Correo o usuario</label><input type="text" id="usuario" name="usuario" required></div>
        <div class="campo"><label for="clave">Contraseña</label><input type="password" id="clave" name="clave" required></div>
        <button class="btn btn-bloque" type="submit">Iniciar sesión</button>
        <p class="ayuda"><a href="recuperar.html">Recuperar contraseña</a></p>
        <p class="ayuda">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
      </form>
    </div>
  </main>
</body>
</html>
