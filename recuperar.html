<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cool Studio: tienda en línea de camisetas con letras urbanas.">
  <title>Recuperar contraseña | Cool Studio</title>
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/paginas.css">
</head>
<body>
  <main class="centrado">
    <div class="auth simple">
      <form class="formulario" action="#" method="post">
        <a class="logo" href="index.html">COOL <span>STUDIO</span></a>
        <h1>Recuperar contraseña</h1>
        <p>Escribe tu correo y te enviaremos un enlace para crear una nueva contraseña.</p>
        <div class="campo"><label for="correo">Correo</label><input type="email" id="correo" name="correo" required></div>
        <button class="btn btn-bloque" type="submit">Enviar enlace de recuperación</button>
        <p class="ayuda"><a href="login.html">Volver a iniciar sesión</a></p>
      </form>
    </div>
  </main>
</body>
</html>
